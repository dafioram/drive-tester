[workspace]
resolver = "3"
members = [
    "crates/drivetest-core",
    "crates/drivetest-win",
    "crates/drivetest-cli",
    "crates/drivetest-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
drivetest-core = { path = "crates/drivetest-core" }
drivetest-win = { path = "crates/drivetest-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
eframe = "0.37"
windows-sys = "0.61"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
