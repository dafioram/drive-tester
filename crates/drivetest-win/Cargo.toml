[package]
name = "drivetest-win"
description = "Windows implementation of the Drive Test platform layer (raw disk I/O, SMART/NVMe pass-through, volume locking)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
drivetest-core.workspace = true

[target.'cfg(windows)'.dependencies.windows-sys]
workspace = true
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_IscsiDisc",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
]
